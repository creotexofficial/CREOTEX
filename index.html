<html lang="en" data-theme="dark">

  <meta property="og:title" content="CreotexShop - Premier Robotics &amp; Maker Components Store" />

  <!-- Structured Data JSON-LD for 100% SEO Score -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Store",
    "name": "CreotexShop",
    "description": "Premier robotics and maker hardware superstore in India.",
    "url": "https://creotexshop.com/",
    "logo": "https://creotexshop.com/logo-dark.jpg",
    "currenciesAccepted": "INR",
    "paymentAccepted": "Cash, Credit Card, UPI, Net Banking",
    "priceRange": "₹49 - ₹15000",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://creotexshop.com/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
